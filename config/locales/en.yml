    create:
      success:
        one: Your court is booked! We've sent you a confirmation email.
        other: Your %{count} courts are booked! We've sent you a confirmation email.
    cancel:
      success: Your booking has been cancelled.
      not_allowed: This booking can no longer be cancelled.
    show:
      title: "Booking %{code}"
      all_bookings: My bookings
      cancel: Cancel booking
