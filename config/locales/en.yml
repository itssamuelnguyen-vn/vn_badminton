# English translations. Vietnamese (vi.yml) is the default locale; keep both files in sync.
# Rails' own messages ("can't be blank", dates, ...) come from the rails-i18n gem.

en:
  time:
    formats:
      hour_minute: "%H:%M"
      slot: "%H:%M on %d/%m/%Y"

  activerecord:
    models:
      user: User
      venue: Venue
      opening_hour: Opening hours
      court: Court
      price_rule: Price rule
      booking: Booking

    attributes:
      user:
        email: Email
        full_name: Full name
        phone: Phone number
        role: Role
        login: Email or phone number
        password: Password
        password_confirmation: Confirm password
        current_password: Current password
      venue:
        name: Name
        slug: Slug
        address: Address
        phone: Phone number
        time_zone: Time zone
        min_booking_minutes: Minimum booking duration
        max_booking_minutes: Maximum booking duration
        cancellation_cutoff_hours: Cancellation cutoff (hours)
        booking_horizon_days: Booking horizon (days)
        status: Status
      opening_hour:
        day_of_week: Day of week
        opens_minute: Opening time
        closes_minute: Closing time
      court:
        name: Name
        position: Position
        status: Status
      price_rule:
        name: Name
        court: Court
        days_of_week: Days of week
        start_minute: Start time
        end_minute: End time
        price_per_hour_vnd: Price per hour
        priority: Priority
        valid_from: Valid from
        valid_until: Valid until
      booking:
        court: Court
        user: Account
        code: Booking code
        starts_at: Start time
        ends_at: End time
        customer_name: Customer name
        customer_phone: Customer phone
        total_amount_vnd: Total amount
        note: Note
        expires_at: Hold expiry

    errors:
      models:
        user:
          attributes:
            password_confirmation:
              confirmation: "doesn't match the password"
        venue:
          not_multiple_of_30: "must be a multiple of 30"
          less_than_min: "must be greater than or equal to the minimum duration"
        opening_hour:
          after_opening: "must be after the opening time"
          off_slot_grid: "Opening and closing times must be on the half hour"
        price_rule:
          invalid_days: "may only contain values 0-6"
          after_start: "must be after the start time"
          off_slot_grid: "The time range must be on the half hour"
          not_multiple_of_1000: "must be a multiple of 1,000 VND"
          before_valid_from: "must be after the start date"
          other_venue: "does not belong to this venue"
        booking:
          slot_just_taken: "This slot was just booked by someone else, please choose another time"
          slot_taken: "This slot is already booked"
          no_price: "No price is set for the slot at %{time}"
          after_start: "must be after the start time"
          off_slot_grid: "Booking times must be on the half hour (e.g. 18:00, 18:30)"
          court_inactive: "is not in operation"
          venue_inactive: "belongs to a venue that is temporarily closed"
          outside_opening_hours: "Outside the venue's opening hours"
          not_in_future: "must be in the future"
          beyond_horizon:
            one: "can be at most %{count} day in advance"
            other: "can be at most %{count} days in advance"
          duration_out_of_range: "Duration must be between %{min} and %{max} minutes"

  layouts:
    application:
      header:
        schedule: Book a court
        my_bookings: My bookings
        sign_in: Sign in
        sign_up: Sign up
        sign_out: Sign out
      locale_switcher:
        label: Language


  devise:
    sessions:
      new:
        title: Sign in
        login: Email or phone number
        login_hint: "For example: an@example.com or 0901 234 567"
        remember_me: Remember me
        forgot_password: Forgot your password?
        submit: Sign in
        no_account: Don't have an account?
        sign_up: Sign up
    registrations:
      new:
        title: Create an account
        password_hint:
          one: "At least %{count} character"
          other: "At least %{count} characters"
        submit: Sign up
        have_account: Already have an account?
        sign_in: Sign in
      edit:
        title: Account settings
        change_password: Change password
        new_password: New password
        password_hint: Leave blank to keep your current password
        current_password_hint: Required to save any changes
        submit: Save changes
    passwords:
      new:
        title: Forgot your password?
        description: Enter your email and we'll send you a link to reset your password.
        submit: Send reset link
        back_to_sign_in: Back to sign in
      edit:
        title: Set a new password
        new_password: New password
        submit: Change password
    shared:
      error_messages:
        title:
          one: "Please fix the error below:"
          other: "Please fix the %{count} errors below:"
    mailer:
      reset_password_instructions:
        greeting: "Hello %{name},"
        instruction: "Someone has requested a link to change your password. You can do this through the link below."
        action: Change my password
        ignore: "If you didn't request this, please ignore this email."
        unchanged: "Your password won't change until you open the link above and create a new one."

  date:
    formats:
      month_year: "%B %Y"
      full: "%A, %d/%m/%Y"
      day_month_year: "%d/%m/%Y"
  helpers:
    vnd: "%{amount} VND"
    every_day: Every day

  schedules:
    show:
      title: Book a court
      continue: Continue
      closed: The venue is closed on this day.
      too_short: "Please choose at least %{minutes} minutes"
      too_long: "You can book at most %{minutes} minutes at a time"
      number_locale: en-US
      multiple: Book several courts
      total: "Total: %{amount}"
      no_slots_left: There are no more bookable times on this day. Please choose another date.
    date_picker:
      label: Choose a date
      today: today
      previous_day: Previous day
      next_day: Next day
      previous_month: Previous month
      next_month: Next month
      weekdays: [ Mo, Tu, We, Th, Fr, Sa, Su ]
      horizon:
        one: "You can book up to %{count} day ahead (until %{last})."
        other: "You can book up to %{count} days ahead (until %{last})."
    legend:
      label: Legend
      available: Available
      selected: Selected
      mine: Your booking
      booked: Booked
      blocked: Maintenance
      unavailable: Unavailable
    grid:
      label: "Court schedule for %{date}"
      states:
        available: Available
        booked: Booked
        mine: Yours
        blocked: Maintenance
        unavailable: Unavailable
    price_list:
      title: Prices
      name: Rate
      when: Applies
      price: Price
      per_hour: "%{price}/hour"
      note: Prices are charged per 30-minute slot. Pay at the venue.

  bookings:
    statuses:
      pending: Pending
      confirmed: Confirmed
      checked_in: Checked in
      completed: Completed
      cancelled: Cancelled
      no_show: No-show
    details:
      date: Date
      time: Time
      total: Total
      price: Price
    new:
      title: Confirm your booking
      customer: Booked by
      customer_hint_html: "Taken from your account. Need a change? Go to %{link}."
      account_settings: account settings
      note_placeholder: "For example: need to rent rackets"
      pay_at_venue: Pay at the venue when you arrive.
      back: Choose another time
      submit: Confirm booking
      grand_total:
        one: "Total (%{count} court)"
        other: "Total (%{count} courts)"
      no_selection: Please pick a time on the schedule first.
    create:
      success:
        one: Your court is booked! We've sent you a confirmation email.
        other: Your %{count} courts are booked! We've sent you a confirmation email.
    cancel:
      success: Your booking has been cancelled.
      not_allowed: This booking can no longer be cancelled.
    show:
      title: "Booking %{code}"
      all_bookings: My bookings
      cancel: Cancel booking
      cancel_confirm: Are you sure you want to cancel this booking?
      cancel_cutoff: "Online cancellation closes %{hours} hours before the start time. Please call the venue."
    index:
      title: My bookings
      new: Book a court
      upcoming: Upcoming
      no_upcoming: You have no upcoming bookings.
      past: Past and cancelled

  booking_mailer:
    confirmed:
      subject: "Booking confirmed: %{codes}"
      greeting: "Hello %{name},"
      intro:
        one: "Your court booking is confirmed:"
        other: "Your bookings for %{count} courts are confirmed:"
      view_bookings: View my bookings
      cancel_policy: "You can cancel online up to %{hours} hours before the start time."
