        next_day: Next day
        go: Show
        today: Today
      grid:
        label: "Courts on %{date}"
        book_slot: "Book %{court} at %{time}"
      list:
        title: Bookings of the day
        empty: No bookings on this day yet.
        cancelled:
          one: "%{count} cancelled booking"
          other: "%{count} cancelled bookings"
