      cancel_cutoff: "Online cancellation closes %{hours} hours before the start time. Please call the venue."
    index:
      title: My bookings
      new: Book a court
      upcoming: Upcoming
      no_upcoming: You have no upcoming bookings.
      past: Past and cancelled

  booking_mailer:
