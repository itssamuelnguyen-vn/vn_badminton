# Vietnamese translations (default locale). Keep in sync with en.yml.
# Rails' own messages ("không thể để trống", dates, ...) come from the rails-i18n gem.

vi:
  time:
    formats:
      slot: "%H:%M ngày %d/%m/%Y"

  activerecord:
