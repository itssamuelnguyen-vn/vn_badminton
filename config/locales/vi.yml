        action: Đổi mật khẩu
        ignore: "Nếu bạn không yêu cầu, hãy bỏ qua email này."
        unchanged: "Mật khẩu của bạn sẽ không thay đổi cho tới khi bạn mở đường dẫn trên và tạo mật khẩu mới."
