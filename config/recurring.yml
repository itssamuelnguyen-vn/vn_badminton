# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

booking_reminders: &booking_reminders
  class: BookingReminderJob
  queue: default
  schedule: every 10 minutes

# Expired holds stop counting as soon as they expire; this only deletes the leftover rows.
# Refunds of skipped regular sessions are decided once they are over.
series_refunds: &series_refunds
  class: SeriesRefundJob
  queue: default
  schedule: every 15 minutes

release_expired_holds: &release_expired_holds
  command: "Booking.release_expired_holds!"
  schedule: every 15 minutes

account_deletions: &account_deletions
  class: AccountDeletionJob
  queue: default
  schedule: every 15 minutes

development:
  booking_reminders: *booking_reminders
  series_refunds: *series_refunds
  release_expired_holds: *release_expired_holds
  account_deletions: *account_deletions

production:
  booking_reminders: *booking_reminders
  series_refunds: *series_refunds
  release_expired_holds: *release_expired_holds
  account_deletions: *account_deletions
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
