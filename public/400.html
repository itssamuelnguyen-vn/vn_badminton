<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Yêu cầu không hợp lệ | VN Badminton</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <!-- Static page served by Rails even when the app itself fails: no layout or Tailwind build here,
       so the colors (emerald/slate) and the logo of the site header are inlined. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0; min-height: 100%; display: flex; flex-direction: column;
      background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    header { border-bottom: 1px solid #e2e8f0; background: #fff; }
    header a {
      display: flex; align-items: center; gap: .5rem; max-width: 64rem; margin: 0 auto; padding: .75rem 1rem;
      color: #047857; font-size: 1.125rem; font-weight: 700; text-decoration: none;
    }
    header svg { width: 1.5rem; height: 1.5rem; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card {
      width: 100%; max-width: 28rem; padding: 2rem; border-radius: 1rem; background: #fff; text-align: center;
      box-shadow: 0 1px 2px rgb(0 0 0 / .05), 0 0 0 1px #e2e8f0;
    }
    .code { margin: 0 0 .5rem; color: #059669; font-size: 3rem; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
    h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; }
    p { margin: .75rem 0 0; color: #475569; line-height: 1.5; }
    .actions { margin-top: 1.5rem; display: flex; justify-content: center; }
    .btn {
      display: inline-flex; justify-content: center; padding: .625rem 1rem; border-radius: .5rem;
      font-size: .875rem; font-weight: 600; text-decoration: none;
    }
    .btn-primary { background: #059669; color: #fff; }
    .btn-primary:hover { background: #047857; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 15.5 4 4l11.5 4.5"/><path d="M6.5 10 14 9.5M9.5 6.5 9 14"/><circle cx="16.5" cy="16.5" r="3.5"/>
      </svg>
      VN Badminton
    </a>
  </header>
  <main>
    <div class="card">
      <p class="code">400</p>
      <!-- One language at a time: Vietnamese by default, English when the failing URL is under /en (script below). -->
      <div data-lang="vi">
        <h1>Yêu cầu không hợp lệ</h1>
        <p>Trình duyệt đã gửi một yêu cầu không hợp lệ. Vui lòng quay lại trang chủ và thử lại.</p>
        <div class="actions"><a class="btn btn-primary" href="/">Về trang đặt sân</a></div>
      </div>
      <div data-lang="en" lang="en" hidden>
        <h1>Bad request</h1>
        <p>Your browser sent a request we could not understand. Please go back to the home page and try again.</p>
        <div class="actions"><a class="btn btn-primary" href="/en">Back to the booking page</a></div>
      </div>
    </div>
  </main>
  <script>
    // Plain ES5: this also runs on the "unsupported browser" page.
    if (/^\/en(\/|$)/.test(window.location.pathname)) {
      var blocks = document.querySelectorAll("[data-lang]");
      for (var i = 0; i < blocks.length; i++) blocks[i].hidden = blocks[i].getAttribute("data-lang") !== "en";
      document.documentElement.lang = "en";
      document.title = "Bad request | VN Badminton";
      document.querySelector("header a").setAttribute("href", "/en");
    }
  </script>
</body>
</html>
